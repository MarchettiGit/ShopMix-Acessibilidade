<!doctype html>
<html lang="pt-br" data-bs-theme="auto">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <title th:text="${produto != null ? 'Editar Anúncio' : 'Cadastrar Anúncio'}"></title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <link href="/css/checkout.css" rel="stylesheet"/>
    <link rel="shortcut icon" href="/assets/imgs/ico/shopico.ico" type="image/x-icon">

    <style>
        .preview-img {
            height: 250px;
            object-fit: cover;
        }
    </style>
</head>

<body class="bg-body-tertiary">

<div class="container">

    <main>

        <!-- TÍTULO -->
        <div class="py-5 text-center">

            <h2 th:text="${produto != null ? 'Editar anúncio' : 'Criar novo anúncio'}"></h2>

            <p class="lead">
                Preencha as informações do produto para anunciar nas plataformas.
            </p>

        </div>

        <div class="row g-5">

            <!-- PREVIEW -->
            <div class="col-md-5 col-lg-4 order-md-last">

                <h4 class="mb-3">Preview do anúncio</h4>

                <div class="card shadow-sm">

                    <img
                            th:src="${produto != null and produto.imagemUrl != null ? produto.imagemUrl : 'https://via.placeholder.com/300x200'}"
                            class="card-img-top preview-img"
                            id="previewImage"
                            alt="Imagem do produto"
                    >

                    <div class="card-body">

                        <h5
                                class="card-title"
                                id="previewTitle"
                                th:text="${produto != null ? produto.nome : 'Nome do produto'}">
                        </h5>

                        <p
                                class="card-text"
                                id="previewDesc"
                                th:text="${produto != null ? produto.descricao : 'Descrição breve do produto...'}">
                        </p>

                        <p
                                class="fw-bold text-success"
                                id="previewPrice"
                                th:text="${produto != null and produto.preco != null ? 'R$ ' + produto.preco : 'R$ 0,00'}">
                        </p>

                    </div>

                </div>

            </div>

            <!-- FORM -->
            <div class="col-md-7 col-lg-8">

                <h4 class="mb-3">Dados do produto</h4>

                <form
                        th:action="${produto != null} ? @{/anuncio/editar/{id}(id=${produto.id})} : @{/anunciar}"
                        method="POST"
                        enctype="multipart/form-data"
                        class="needs-validation"
                        novalidate
                >
                >

                    <!-- CSRF -->
                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                    />

                    <!-- ID -->
                    <input
                            type="hidden"
                            name="id"
                            th:value="${produto != null ? produto.id : ''}"
                    >

                    <div class="row g-3">

                        <!-- NOME -->
                        <div class="col-12">

                            <label class="form-label">
                                Nome do produto
                            </label>

                            <input
                                    type="text"
                                    name="nome"
                                    id="nome"
                                    class="form-control"
                                    th:value="${produto != null ? produto.nome : ''}"
                                    required
                            >

                        </div>

                        <!-- DESCRIÇÃO -->
                        <div class="col-12">

                            <label class="form-label">
                                Descrição
                            </label>

                            <textarea
                                    name="descricao"
                                    id="descricao"
                                    class="form-control"
                                    rows="3"
                                    required
                                    th:text="${produto != null ? produto.descricao : ''}">
                            </textarea>

                        </div>

                        <!-- PREÇO -->
                        <div class="col-md-6">

                            <label class="form-label">
                                Preço
                            </label>

                            <input
                                    type="number"
                                    step="0.01"
                                    id="preco"
                                    name="preco"
                                    class="form-control"
                                    th:value="${produto != null ? produto.preco : ''}"
                                    required
                            >

                        </div>

                        <!-- ESTOQUE -->
                        <div class="col-md-6">

                            <label class="form-label">
                                Quantidade em estoque
                            </label>

                            <input
                                    type="number"
                                    name="quantidade"
                                    class="form-control"
                                    th:value="${produto != null ? produto.quantidade : ''}"
                                    required
                            >

                        </div>

                        <!-- CATEGORIA -->
                        <div class="col-md-6">

                            <label class="form-label">
                                Categoria
                            </label>

                            <select
                                    name="categoria"
                                    class="form-select"
                                    required
                            >

                                <option value="">
                                    Selecione...
                                </option>

                                <option
                                        value="Eletrônicos"
                                        th:selected="${produto != null and produto.categoria == 'Eletrônicos'}">
                                    Eletrônicos
                                </option>

                                <option
                                        value="Roupas"
                                        th:selected="${produto != null and produto.categoria == 'Roupas'}">
                                    Roupas
                                </option>

                                <option
                                        value="Casa"
                                        th:selected="${produto != null and produto.categoria == 'Casa'}">
                                    Casa
                                </option>

                                <option
                                        value="Beleza"
                                        th:selected="${produto != null and produto.categoria == 'Beleza'}">
                                    Beleza
                                </option>

                            </select>

                        </div>

                        <!-- PLATAFORMA -->
                        <div class="col-md-6">

                            <label class="form-label">
                                Plataforma
                            </label>

                            <select
                                    name="plataforma"
                                    class="form-select"
                                    required
                            >

                                <option value="">
                                    Selecione...
                                </option>

                                <option
                                        value="Shopee"
                                        th:selected="${produto != null and produto.plataforma == 'Shopee'}">
                                    Shopee
                                </option>

                                <option
                                        value="Mercado Livre"
                                        th:selected="${produto != null and produto.plataforma == 'Mercado Livre'}">
                                    Mercado Livre
                                </option>

                            </select>

                        </div>

                        <!-- IMAGEM -->
                        <div class="col-12">

                            <label class="form-label">
                                Imagem do produto
                            </label>

                            <input
                                    type="file"
                                    class="form-control"
                                    id="imagemProduto"
                                    name="imagemFile"
                                    accept="image/*"
                            >

                        </div>

                    </div>

                    <hr class="my-4">

                    <!-- CHECKBOX -->
                    <div class="form-check">

                        <input
                                type="checkbox"
                                class="form-check-input"
                                id="freteGratis"
                                name="freteGratis"
                                th:checked="${produto != null and produto.freteGratis == true}"
                        >

                        <label class="form-check-label">
                            Frete grátis
                        </label>

                    </div>

                    <div class="form-check">

                        <input
                                type="checkbox"
                                class="form-check-input"
                                id="ativo"
                                name="ativo"
                                th:checked="${produto == null or produto.ativo == true}"
                        >

                        <label class="form-check-label">
                            Anúncio ativo
                        </label>

                    </div>

                    <hr class="my-4">

                    <!-- BOTÃO -->
                    <button
                            class="w-100 btn btn-primary btn-lg"
                            type="submit"
                    >

                        <span
                                th:text="${produto != null ? 'Salvar alterações ✏️' : 'Publicar anúncio 🚀'}">
                        </span>

                    </button>

                </form>

            </div>

        </div>

    </main>

</div>

<script>

    const nome = document.getElementById("nome");
    const descricao = document.getElementById("descricao");
    const preco = document.getElementById("preco");
    const imagem = document.getElementById("imagemProduto");

    const previewTitle = document.getElementById("previewTitle");
    const previewDesc = document.getElementById("previewDesc");
    const previewPrice = document.getElementById("previewPrice");
    const previewImage = document.getElementById("previewImage");

    nome.addEventListener("input", () => {
        previewTitle.textContent =
            nome.value || "Nome do produto";
    });

    descricao.addEventListener("input", () => {
        previewDesc.textContent =
            descricao.value || "Descrição breve do produto...";
    });

    preco.addEventListener("input", () => {

        let valor = preco.value || 0;

        previewPrice.textContent =
            "R$ " + valor;
    });

    imagem.addEventListener("change", (event) => {

        const file = event.target.files[0];

        if (file) {

            const reader = new FileReader();

            reader.onload = function (e) {
                previewImage.src = e.target.result;
            }

            reader.readAsDataURL(file);
        }
    });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
