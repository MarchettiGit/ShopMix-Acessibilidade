<!doctype html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Cadastro - ShopMix</title>

    <link rel="stylesheet" href="/css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<header class="header text-center p-4">

    <img src="/assets/imgs/login-shopmix/ShopMix 4x.png"
         style="max-width: 200px;">

    <h1 class="mt-3">
        Cadastro de Usuário
    </h1>

    <p>
        Crie sua conta no ShopMix
    </p>

</header>

<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 60vh;">

    <div class="card p-4 shadow"
         style="width:100%; max-width:450px;">

        <h3 class="text-center mb-4">
            Cadastro
        </h3>

        <form action="/cadastro"
              method="POST">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <!-- NOME -->

            <div class="mb-3">

                <label class="form-label">
                    Nome completo
                </label>

                <input type="text"
                       name="nome"
                       class="form-control"
                       minlength="3"
                       required>

            </div>

            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email corporativo
                </label>

                <input type="email"
                       name="email"
                       class="form-control"
                       required>

            </div>

            <!-- SENHA -->

            <div class="mb-3">

                <label class="form-label">
                    Senha
                </label>

                <input type="password"
                       name="senha"
                       id="senha"
                       class="form-control"

                       pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&]).{12,}$"

                       title="A senha deve ter no mínimo 12 caracteres, incluindo número e símbolo."

                       required>

                <small class="text-muted">

                    A senha deve conter:
                    <br>
                    • mínimo 8 caracteres
                    <br>
                    • pelo menos 1 número
                    <br>
                    • pelo menos 1 símbolo

                </small>

            </div>

            <!-- CONFIRMAR SENHA -->

            <div class="mb-3">

                <label class="form-label">
                    Confirmar senha
                </label>

                <input type="password"
                       id="confirmarSenha"
                       class="form-control"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-success w-100">

                Criar conta

            </button>
            <div th:if="${param.erro}"
                 class="alert alert-danger">

                Senha inválida.

            </div>

        </form>

    </div>

</div>

<script>

    const form = document.querySelector("form");

    form.addEventListener("submit", function(e){

        const senha =
            document.getElementById("senha").value;

        const confirmar =
            document.getElementById("confirmarSenha").value;

        if(senha !== confirmar){

            e.preventDefault();

            alert("As senhas não coincidem.");
        }
    });

</script>

</body>
</html>
