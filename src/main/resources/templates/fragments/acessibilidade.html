<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <!-- Recursos de acessibilidade (CSS). Incluir no <head>. -->
    <th:block th:fragment="recursos">
        <link rel="stylesheet" href="/css/accessibility.css">
    </th:block>
</head>
<body>

<!-- Link para pular direto ao conteúdo principal. Primeiro elemento do <body>. -->
<a th:fragment="skip-link" class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

<!-- Botão alternador de tema claro/escuro. Colocar no topo da página. -->
<button th:fragment="tema"
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-pressed="false"
        aria-label="Ativar modo escuro">
    <svg class="theme-icon-dark" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"></path>
    </svg>
    <svg class="theme-icon-light" viewBox="0 0 16 16" aria-hidden="true" focusable="false" hidden>
        <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.708l1.414 1.415a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"></path>
    </svg>
    <span class="theme-toggle-text">Modo escuro</span>
</button>

<!-- Barra superior pronta com o alternador de tema alinhado à direita. -->
<div th:fragment="barra-tema" class="a11y-topbar">
    <button type="button"
            id="theme-toggle"
            class="theme-toggle"
            aria-pressed="false"
            aria-label="Ativar modo escuro">
        <svg class="theme-icon-dark" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"></path>
        </svg>
        <svg class="theme-icon-light" viewBox="0 0 16 16" aria-hidden="true" focusable="false" hidden>
            <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.708l1.414 1.415a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"></path>
        </svg>
        <span class="theme-toggle-text">Modo escuro</span>
    </button>
</div>

<!-- Painel de acessibilidade flutuante. -->
<div th:fragment="painel">

    <!-- Região que anuncia mudanças para leitores de tela -->
    <div id="a11y-status" class="visually-hidden" aria-live="polite" role="status"></div>

    <button type="button"
            id="a11y-fab"
            class="a11y-fab"
            aria-expanded="false"
            aria-controls="a11y-panel"
            aria-label="Abrir painel de acessibilidade"
            title="Acessibilidade">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm9 5.5c0 .7-.6 1.2-1.3 1.1L15 8v4l2.6 7.4a1.2 1.2 0 1 1-2.3.8L13 14h-2l-2.3 6.2a1.2 1.2 0 1 1-2.3-.8L9 12V8l-4.7.6A1.2 1.2 0 1 1 4.4 6.2L10 7h4l5.6-.8c.7-.1 1.4.4 1.4 1.3z"></path>
        </svg>
    </button>

    <section id="a11y-panel"
             class="a11y-panel"
             role="dialog"
             aria-labelledby="a11y-panel-title"
             hidden>

        <h2 id="a11y-panel-title">Acessibilidade</h2>

        <div class="a11y-group">
            <span class="a11y-label" id="a11y-text-label">Tamanho do texto</span>
            <div class="a11y-actions" role="group" aria-labelledby="a11y-text-label">
                <button type="button" id="a11y-decrease-btn" class="a11y-btn" aria-label="Diminuir tamanho do texto">A-</button>
                <button type="button" id="a11y-increase-btn" class="a11y-btn" aria-label="Aumentar tamanho do texto">A+</button>
            </div>
        </div>

        <div class="a11y-group">
            <span class="a11y-label" id="a11y-contrast-label">Contraste</span>
            <div class="a11y-actions" role="group" aria-labelledby="a11y-contrast-label">
                <button type="button"
                        id="a11y-contrast-btn"
                        class="a11y-btn"
                        aria-pressed="false">
                    Alto contraste
                </button>
            </div>
        </div>

        <div class="a11y-group" id="a11y-voice-group">
            <span class="a11y-label" id="a11y-voice-label">Leitura por voz</span>
            <div class="a11y-actions" role="group" aria-labelledby="a11y-voice-label">
                <button type="button" id="a11y-read-btn" class="a11y-btn">Ler a página</button>
                <button type="button" id="a11y-stop-btn" class="a11y-btn">Parar</button>
            </div>
            <button type="button"
                    id="a11y-readfocus-btn"
                    class="a11y-btn a11y-btn-block"
                    aria-pressed="false">
                Ler itens ao focar
            </button>
        </div>

        <div class="a11y-group">
            <button type="button" id="a11y-reset-btn" class="a11y-reset">
                Restaurar configurações
            </button>
        </div>

    </section>
</div>

<!-- Script do painel. Incluir antes do </body>. -->
<th:block th:fragment="scripts">
    <script src="/js/accessibility.js"></script>
</th:block>

</body>
</html>
