<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopMix - Login</title>

    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header class="header text-center p-4">
    <img src="/assets/imgs/login-shopmix/ShopMix 4x.png" alt="ShopMix Logo" style="max-width: 200px;">
    <h1 class="mt-3">Bem-vindo ao ShopMix</h1>
    <p>Faça login para continuar</p>
</header>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">

    <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">

        <h3 class="mb-3 text-center">Login</h3>

        <!-- ALERTA DE ERRO (BACK-END PREENCHE) -->
        <!-- Exemplo: renderizar se houver erro -->
        <div id="errorMessage" class="alert alert-danger d-none">
            Email ou senha inválidos
        </div>

        <form action="/login" method="POST">

            <!-- EMAIL -->
            <div class="mb-3">
                <label class="form-label">Email corporativo</label>
                <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Digite seu email"
                        required
                >
            </div>

            <!-- SENHA -->
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Digite sua senha"
                        required
                >
            </div>

            <!-- LEMBRAR -->
            <div class="form-check mb-3">
                <input type="checkbox" name="remember" class="form-check-input">
                <label class="form-check-label">Lembrar de mim</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Entrar
            </button>

        </form>

    </div>

</div>

<footer class="text-center mt-5 mb-3">
    <small>&copy; 2025 ShopMix</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
